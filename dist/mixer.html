<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Aari embroidery designs and stitching lessons in Tamil and English.">
<title>Design Mixer · Aari Studio</title>
<link rel="stylesheet" href="style.css?v=gallery-first"><script defer src="app.js?v=gallery-first"></script><script defer src="catalog.js"></script><script defer src="designs.js"></script>
</head>
<body>
<header class="top"><div class="bar">
<a class="brand" href="./"><span aria-hidden="true" class="mark">✿</span> Aari Studio</a>
<nav aria-label="Main navigation"><a href="./" data-i="readyNav">Ready-Made Designs</a><a href="learn.html#chain-stitch" data-i="trainingGallery">Training Gallery</a><a href="mixer.html" data-i="mixerTitle" aria-current="page">Design Mixer</a><a href="practice.html" data-i="practice">My Practice</a></nav>
<button class="language" id="language" type="button">தமிழ்</button>
</div></header>
<main>
<section class="section" id="design-mixer" aria-labelledby="mixer-title">
<div class="mixer">
<div class="mixer-controls"><h1 class="page-title" id="mixer-title" data-i="mixerTitle">Design Mixer</h1><p data-i="mixerIntro"></p><div class="design-fields"><label><span data-i="placementLabel"></span><select id="mix-placement"><option value="small" data-i="small"></option><option value="sleeve" data-i="sleeve"></option><option value="neck" data-i="neck"></option><option value="border" data-i="border"></option></select></label><label><span data-i="mainLabel"></span><select id="mix-main"><option value="lotus" data-i="lotus"></option><option value="paisley" data-i="paisley"></option><option value="jasmine" data-i="jasmine"></option><option value="leaf" data-i="leaf"></option><option value="bud" data-i="bud"></option></select></label><label><span data-i="accentLabel"></span><select id="mix-accent"><option value="leaf" data-i="leaf"></option><option value="bud" data-i="bud"></option><option value="lotus" data-i="lotus"></option><option value="paisley" data-i="paisley"></option><option value="jasmine" data-i="jasmine"></option></select></label><label><span data-i="paletteLabel"></span><select id="mix-palette"><option value="wine" data-i="wine"></option><option value="teal" data-i="teal"></option><option value="indigo" data-i="indigo"></option></select></label></div>
<div class="actions"><button type="button" class="button" id="mix-surprise" data-i="surprise"></button><a class="button soft" id="mix-download" download="aari-studio-mixed-design.png" data-i="downloadImage"></a></div></div>
<canvas id="mix-preview" width="600" height="360" role="img" data-label="previewLabel"></canvas>
<div class="ai-panel"><h4 data-i="aiTitle"></h4><p data-i="aiText"></p>
<div class="actions"><button type="button" class="button soft" id="ai-copy" data-i="aiCopy"></button><a class="button soft" href="https://chatgpt.com/" target="_blank" rel="noopener" data-i="openChatGPT"></a></div>
<textarea id="ai-prompt" readonly data-label="aiPromptLabel" hidden></textarea><p id="mix-feedback" role="status"></p></div>
</div>
</section>
</main><footer><div class="footer-inner"><span class="brand"><span class="mark" aria-hidden="true">✿</span> Aari Studio</span><span data-i="footer"></span></div></footer>
</body>
</html>
